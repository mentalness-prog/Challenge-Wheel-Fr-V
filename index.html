<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Roue des Défis — Mentalness</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito+Sans:ital,wght@0,400;0,600;0,700;1,600&family=Poppins:wght@700;800;900&display=swap" rel="stylesheet">
<style>
  :root{
    --teal-900:#0a5c52;
    --teal-700:#0e7c6f;
    --teal-600:#127a6d;
    --teal-500:#1a8a7c;
    --teal-300:#5fada0;
    --gold-700:#c98f4e;
    --gold-500:#d4a463;
    --gold-300:#e8c194;
    --gold-100:#f6e2bf;
    --cream:#faf6ee;
    --ink:#163330;
    --ink-soft:#3c5652;
    --shadow: 0 18px 40px rgba(10,60,54,0.18);
  }

  *{box-sizing:border-box;}

  body{
    margin:0;
    min-height:100vh;
    background:
      radial-gradient(circle at 50% -10%, #d9efe9 0%, var(--cream) 45%, var(--cream) 100%);
    font-family:'Nunito Sans', sans-serif;
    color:var(--ink);
    display:flex;
    justify-content:center;
    padding:28px 16px 48px;
  }

  .app{
    width:100%;
    max-width:460px;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:22px;
  }

  /* ---------- header ---------- */
  header{
    display:flex;
    align-items:center;
    gap:14px;
    width:100%;
  }
  header img.brand-mark{
    width:52px;
    height:52px;
    border-radius:50%;
    box-shadow:0 4px 14px rgba(10,60,54,0.25);
    flex-shrink:0;
  }
  header .heading h1{
    font-family:'Baloo 2', sans-serif;
    font-weight:700;
    font-size:1.5rem;
    line-height:1.15;
    margin:0 0 2px;
    color:var(--teal-900);
  }
  header .heading p{
    margin:0;
    font-size:0.9rem;
    color:var(--ink-soft);
  }

  /* ---------- wheel ---------- */
  .wheel-wrap{
    position:relative;
    width:100%;
    max-width:400px;
    aspect-ratio:1/1;
    display:flex;
    align-items:center;
    justify-content:center;
  }

  .pointer{
    position:absolute;
    top:-6px;
    left:50%;
    transform:translateX(-50%);
    width:38px;
    height:44px;
    z-index:5;
    filter:drop-shadow(0 6px 8px rgba(10,60,54,0.35));
  }
  .pointer svg{width:100%;height:100%;display:block;}

  #wheel{
    width:100%;
    height:100%;
    display:block;
    border-radius:50%;
    transform:rotate(0deg);
    transition:transform 4.4s cubic-bezier(0.15,0.68,0.1,1);
    box-shadow: var(--shadow), 0 0 0 8px var(--cream), 0 0 0 11px var(--gold-500);
  }

  .seg-label{
    width:100%;
    height:100%;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
    font-family:'Poppins', sans-serif;
    font-weight:800;
    font-size:19px;
    line-height:1.08;
    padding:2px 6px;
    letter-spacing:0.1px;
    white-space:nowrap;
  }
  .seg-label .word-line{
    display:block;
  }
  .seg-label.on-dark{
    color:#ffffff;
    text-shadow:0 1px 0 rgba(0,0,0,0.35), 0 0 6px rgba(0,0,0,0.2);
  }
  .seg-label.on-light{
    color:#1a1a1a;
    text-shadow:0 1px 0 rgba(255,255,255,0.55);
  }
  .seg-used{ opacity:0.28; }

  .hub{
    position:absolute;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
    z-index:6;
    width:24%;
    aspect-ratio:1/1;
    border-radius:50%;
    background:var(--cream);
    border:4px solid var(--gold-500);
    box-shadow:0 6px 18px rgba(10,60,54,0.3);
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    padding:0;
    animation:pulse 2.6s ease-in-out infinite;
  }
  .hub img{
    width:82%;
    height:82%;
    border-radius:50%;
    object-fit:cover;
  }
  .hub:disabled{ cursor:default; animation:none; }
  .hub:active:not(:disabled){ transform:translate(-50%,-50%) scale(0.94); }

  @keyframes pulse{
    0%,100%{ box-shadow:0 6px 18px rgba(10,60,54,0.3), 0 0 0 0 rgba(212,164,99,0.45); }
    50%{ box-shadow:0 6px 18px rgba(10,60,54,0.3), 0 0 0 10px rgba(212,164,99,0); }
  }

  .spin-hint{
    font-size:0.85rem;
    color:var(--ink-soft);
    text-align:center;
    margin-top:-4px;
  }
  .spin-hint b{ color:var(--teal-700); }

  /* ---------- confetti ---------- */
  .confetti-layer{
    position:absolute;
    inset:0;
    pointer-events:none;
    z-index:7;
    overflow:visible;
  }
  .confetti-bit{
    position:absolute;
    top:50%;
    left:50%;
    width:8px;
    height:8px;
    border-radius:2px;
    opacity:0;
  }
  @keyframes burst{
    0%{ transform:translate(-50%,-50%) translate(0,0) scale(0.6) rotate(0deg); opacity:1; }
    100%{ transform:translate(-50%,-50%) translate(var(--dx), var(--dy)) scale(1) rotate(var(--rot)); opacity:0; }
  }

  /* ---------- controls ---------- */
  .controls{
    width:100%;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    background:#ffffffaa;
    border:1px solid var(--gold-100);
    border-radius:14px;
    padding:10px 14px;
    font-size:0.86rem;
  }
  .controls label{
    display:flex;
    align-items:center;
    gap:8px;
    color:var(--ink-soft);
    cursor:pointer;
  }
  .controls input[type=checkbox]{
    width:17px;height:17px;
    accent-color:var(--teal-700);
  }
  .controls button{
    border:1.5px solid var(--teal-700);
    background:transparent;
    color:var(--teal-700);
    font-family:'Nunito Sans', sans-serif;
    font-weight:700;
    font-size:0.82rem;
    padding:7px 13px;
    border-radius:20px;
    cursor:pointer;
    transition:background 0.15s ease, color 0.15s ease;
    white-space:nowrap;
  }
  .controls button:hover{ background:var(--teal-700); color:#fff; }

  /* ---------- result card ---------- */
  .result-card{
    width:100%;
    background:var(--teal-700);
    background:linear-gradient(165deg, var(--teal-700), var(--teal-900));
    border-radius:20px;
    padding:22px 22px 24px;
    color:var(--cream);
    box-shadow:var(--shadow);
    opacity:1;
    transform:translateY(0) scale(1);
    transition:opacity 0.4s ease, transform 0.4s ease;
    cursor:pointer;
  }
  .result-card.hidden{
    opacity:0;
    transform:translateY(10px) scale(0.98);
    height:0;
    padding:0;
    overflow:hidden;
    pointer-events:none;
  }
  .result-card .pill{
    display:inline-block;
    background:var(--gold-300);
    color:var(--teal-900);
    font-family:'Nunito Sans', sans-serif;
    font-weight:700;
    font-size:0.74rem;
    padding:5px 12px;
    border-radius:20px;
    margin-bottom:10px;
  }
  .result-card h2{
    font-family:'Baloo 2', sans-serif;
    font-size:1.45rem;
    margin:0 0 10px;
    line-height:1.15;
  }
  .result-card p{
    margin:0 0 12px;
    font-size:0.96rem;
    line-height:1.5;
    color:#eaf5f2;
  }

  .tap-hint{
    display:flex;
    align-items:center;
    gap:7px;
    background:rgba(250,246,238,0.14);
    border:1px solid rgba(250,246,238,0.3);
    color:var(--gold-300);
    font-family:'Nunito Sans', sans-serif;
    font-weight:700;
    font-size:0.86rem;
    padding:9px 15px;
    border-radius:20px;
    cursor:pointer;
    margin-top:2px;
    width:fit-content;
  }
  .tap-hint:hover{ background:rgba(250,246,238,0.22); }
  .tap-hint .chevron{
    transition:transform 0.3s ease;
    flex-shrink:0;
  }
  .result-card.expanded .tap-hint .chevron{ transform:rotate(180deg); }

  .expand-body{
    display:grid;
    grid-template-rows:0fr;
    opacity:0;
    transition:grid-template-rows 0.4s ease, opacity 0.35s ease, margin-top 0.4s ease;
    margin-top:0;
  }
  .result-card.expanded .expand-body{
    grid-template-rows:1fr;
    opacity:1;
    margin-top:16px;
  }
  .expand-body > *{ min-height:0; overflow:hidden; }

  .how-to{
    border-top:1px solid rgba(250,246,238,0.25);
    padding-top:14px;
    margin-bottom:14px;
  }
  .how-to .label{
    display:block;
    font-family:'Baloo 2', sans-serif;
    font-weight:600;
    font-size:0.92rem;
    color:var(--gold-300);
    margin-bottom:8px;
  }
  .how-to ol{
    margin:0;
    padding-left:0;
    list-style:none;
    counter-reset:step;
    display:flex;
    flex-direction:column;
    gap:9px;
  }
  .how-to li{
    counter-increment:step;
    display:flex;
    gap:10px;
    font-size:0.92rem;
    line-height:1.45;
    color:#eaf5f2;
  }
  .how-to li::before{
    content:counter(step);
    flex-shrink:0;
    width:22px;
    height:22px;
    border-radius:50%;
    background:var(--gold-500);
    color:var(--teal-900);
    font-family:'Baloo 2', sans-serif;
    font-weight:700;
    font-size:0.78rem;
    display:flex;
    align-items:center;
    justify-content:center;
    margin-top:1px;
  }

  .result-card .why{
    border-top:1px solid rgba(250,246,238,0.25);
    padding-top:12px;
    margin-bottom:14px;
  }
  .result-card .why span.label{
    display:block;
    font-family:'Baloo 2', sans-serif;
    font-weight:600;
    font-size:0.92rem;
    color:var(--gold-300);
    margin-bottom:4px;
  }
  .result-card .why p{
    margin:0;
    font-style:italic;
    font-size:0.9rem;
    color:#dcede9;
  }

  .result-card .example{
    background:rgba(250,246,238,0.12);
    border:1px dashed rgba(232,193,148,0.55);
    border-radius:12px;
    padding:12px 14px;
  }
  .result-card .example .label{
    display:flex;
    align-items:center;
    gap:6px;
    font-family:'Baloo 2', sans-serif;
    font-weight:600;
    font-size:0.92rem;
    color:var(--gold-300);
    margin-bottom:6px;
  }
  .result-card .example .label::before{
    content:'✦';
    font-size:0.85rem;
  }
  .result-card .example p{
    margin:0;
    font-size:0.92rem;
    line-height:1.5;
    color:#fdfaf3;
  }

  footer{
    text-align:center;
    font-size:0.76rem;
    color:var(--ink-soft);
    opacity:0.75;
  }

  @media (prefers-reduced-motion: reduce){
    #wheel{ transition:none; }
    .hub{ animation:none; }
    .confetti-bit{ animation:none; display:none; }
  }
</style>
</head>

      "Gardez une petite surprise ou récompense secrète jusqu'à la dernière question.",
      "Révélez la surprise et félicitez le meilleur score."
    ],
    why:"Un objectif visible et une touche de mystère rendent même une routine du matin motivante.",
    example:"« Répondez à 3 questions pour gagner des points, mais la dernière vaut double si vous justifiez votre réponse ! »"
  },
  {
    title:"Sprint de Mots",
    short:"Sprint de Mots",
    theory:"Activation des connaissances antérieures — Ausubel",
    desc:"Dites un mot lié au sujet du jour, et demandez aux élèves de dire à voix haute la première idée qui leur vient.",
    steps:[
      "Choisissez un mot au cœur de la leçon du jour.",
      "Dites-le à voix haute et faites le tour de la classe pour des réponses en un mot.",
      "Gardez un rythme rapide, sans réponses longues.",
      "Utilisez quelques mots cités pour lancer la leçon."
    ],
    why:"Faire ressortir ce que les élèves savent déjà donne un vrai coup d'accélérateur avant d'ajouter du nouveau.",
    example:"Dites le mot central de la leçon du jour, et faites le tour rapide de la classe pour entendre le premier mot qui vient à l'esprit de chacun."
  }
];

const colors = ["#00BFA6","#FFC93C","#FF6F59","#06D6A0","#FFA630","#4D8AFF","#12CBC4","#FFD23F","#F0416C","#2EC4B6","#FF8C42","#8C6BFA"];

const svgNS = "http://www.w3.org/2000/svg";
const wheelGroup = document.getElementById('wheelGroup');
const cx = 300, cy = 300, r = 292;
const N = challenges.length;
const step = 360 / N;

function polar(cx, cy, rad, angleDeg){
  const a = (angleDeg - 90) * Math.PI / 180;
  return { x: cx + rad * Math.cos(a), y: cy + rad * Math.sin(a) };
}

function luminance(hex){
  const c = hex.replace('#','');
  const r = parseInt(c.substring(0,2),16)/255;
  const g = parseInt(c.substring(2,4),16)/255;
  const b = parseInt(c.substring(4,6),16)/255;
  return 0.299*r + 0.587*g + 0.114*b;
}

const segPaths = [];

challenges.forEach((ch, i) => {
  const a1 = i * step;
  const a2 = a1 + step;
  const p1 = polar(cx, cy, r, a1);
  const p2 = polar(cx, cy, r, a2);
  const largeArc = step > 180 ? 1 : 0;

  const path = document.createElementNS(svgNS, 'path');
  path.setAttribute('d', `M${cx},${cy} L${p1.x.toFixed(2)},${p1.y.toFixed(2)} A${r},${r} 0 ${largeArc},1 ${p2.x.toFixed(2)},${p2.y.toFixed(2)} Z`);
  const fill = colors[i % colors.length];
  path.setAttribute('fill', fill);
  path.setAttribute('stroke', '#faf6ee');
  path.setAttribute('stroke-width', '3');
  wheelGroup.appendChild(path);
  segPaths.push(path);

  const mid = a1 + step/2;
  const labelR = r * 0.64;
  const lp = polar(cx, cy, labelR, mid);
  let rot = mid;
  if (mid > 90 && mid < 270) rot += 180;

  const fw = 168, fh = 96;
  const fo = document.createElementNS(svgNS, 'foreignObject');
  fo.setAttribute('x', (lp.x - fw/2).toFixed(2));
  fo.setAttribute('y', (lp.y - fh/2).toFixed(2));
  fo.setAttribute('width', fw);
  fo.setAttribute('height', fh);
  fo.setAttribute('transform', `rotate(${rot.toFixed(2)} ${lp.x.toFixed(2)} ${lp.y.toFixed(2)})`);

  const div = document.createElement('div');
  div.setAttribute('xmlns', 'http://www.w3.org/1999/xhtml');
  div.className = 'seg-label ' + (luminance(fill) > 0.6 ? 'on-light' : 'on-dark');
  div.innerHTML = ch.short.split(' ').map(w => `<span class="word-line">${w}</span>`).join('');
  fo.appendChild(div);
  wheelGroup.appendChild(fo);
});

const wheelEl = document.getElementById('wheel');
const spinBtn = document.getElementById('spinBtn');
const resultCard = document.getElementById('resultCard');
const resultTheory = document.getElementById('resultTheory');
const resultTitle = document.getElementById('resultTitle');
const resultDesc = document.getElementById('resultDesc');
const resultWhy = document.getElementById('resultWhy');
const resultSteps = document.getElementById('resultSteps');
const resultExample = document.getElementById('resultExample');
const tapHint = document.getElementById('tapHint');
const tapHintLabel = document.getElementById('tapHintLabel');
const excludeUsed = document.getElementById('excludeUsed');
const resetBtn = document.getElementById('resetBtn');
const confettiLayer = document.getElementById('confettiLayer');

let currentRotation = 0;
let spinning = false;
let usedIndexes = new Set();

function updateSegmentStates(){
  segPaths.forEach((p, i) => {
    if (excludeUsed.checked && usedIndexes.has(i)) {
      p.classList.add('seg-used');
    } else {
      p.classList.remove('seg-used');
    }
  });
}

function burstConfetti(){
  const palette = ['#d4a463','#e8c194','#0e7c6f','#faf6ee','#c98f4e'];
  for (let i = 0; i < 18; i++){
    const bit = document.createElement('span');
    bit.className = 'confetti-bit';
    const angle = Math.random() * Math.PI * 2;
    const dist = 60 + Math.random() * 90;
    bit.style.setProperty('--dx', Math.cos(angle) * dist + 'px');
    bit.style.setProperty('--dy', Math.sin(angle) * dist + 'px');
    bit.style.setProperty('--rot', (Math.random() * 360) + 'deg');
    bit.style.background = palette[i % palette.length];
    bit.style.animation = 'burst 0.9s ease-out forwards';
    bit.style.animationDelay = (Math.random() * 0.08) + 's';
    confettiLayer.appendChild(bit);
    setTimeout(() => bit.remove(), 1100);
  }
}

function showResult(idx){
  const ch = challenges[idx];
  resultTheory.textContent = ch.theory;
  resultTitle.textContent = ch.title;
  resultDesc.textContent = ch.desc;
  resultWhy.textContent = ch.why;
  resultExample.textContent = ch.example;

  resultSteps.innerHTML = '';
  ch.steps.forEach(step => {
    const li = document.createElement('li');
    li.textContent = step;
    resultSteps.appendChild(li);
  });

  resultCard.classList.remove('hidden');
  resultCard.classList.remove('expanded');
  tapHintLabel.textContent = 'Touchez pour voir comment faire';
  burstConfetti();
}

resultCard.addEventListener('click', () => {
  const isExpanded = resultCard.classList.toggle('expanded');
  tapHintLabel.textContent = isExpanded ? 'Touchez pour refermer' : 'Touchez pour voir comment faire';
});

spinBtn.addEventListener('click', () => {
  if (spinning) return;

  let available = challenges.map((_, i) => i);
  if (excludeUsed.checked) {
    const remaining = available.filter(i => !usedIndexes.has(i));
    if (remaining.length === 0) {
      usedIndexes.clear();
    } else {
      available = remaining;
    }
  }

  const idx = available[Math.floor(Math.random() * available.length)];
  spinning = true;
  spinBtn.disabled = true;
  resultCard.classList.add('hidden');

  const segMid = idx * step + step / 2;
  const neededMod = ((360 - segMid) % 360 + 360) % 360;
  const curMod = ((currentRotation % 360) + 360) % 360;
  let delta = ((neededMod - curMod) + 360) % 360;
  const extraSpins = 5 + Math.floor(Math.random() * 3);
  delta += extraSpins * 360;
  currentRotation += delta;

  wheelEl.style.transform = `rotate(${currentRotation}deg)`;

  setTimeout(() => {
    spinning = false;
    spinBtn.disabled = false;
    usedIndexes.add(idx);
    updateSegmentStates();
    showResult(idx);
  }, 4450);
});

resetBtn.addEventListener('click', () => {
  usedIndexes.clear();
  updateSegmentStates();
  resultCard.classList.add('hidden');
});

excludeUsed.addEventListener('change', updateSegmentStates);
</script>
